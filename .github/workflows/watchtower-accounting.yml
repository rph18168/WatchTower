name: WatchTower temporary accounting check

on:
  workflow_dispatch:

concurrency:
  group: watchtower-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      # Temporary T10 GET-only inspection; remove after accounting reconciliation.
      - name: Read numeric metadata for the ordinary OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/openrouter-accounting-check.mjs

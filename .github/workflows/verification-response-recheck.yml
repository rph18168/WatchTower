name: Recheck bounded source verification

on:
  push:
    branches: [codex/fix-verification-response]
    paths:
      - .github/workflows/verification-response-recheck.yml
      - scripts/diagnostics/verification-recheck.mjs

permissions:
  contents: read

concurrency:
  group: watchtower-verification-isolated-recheck
  cancel-in-progress: false

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci
      - name: Verify one original source using an isolated budget ledger
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/diagnostics/verification-recheck.mjs

name: WatchTower temporary fee reconciliation

on:
  workflow_dispatch:
    inputs:
      expected_state_sha:
        description: 'Exact independently recorded watchtower-state HEAD'
        type: string
        required: true
      confirm_exclusive_key_delta:
        description: 'Acknowledge the recorded owner confirmation for this single call'
        type: boolean
        default: false
        required: true

concurrency:
  group: watchtower-state
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # Temporary T10 single-call maintenance; remove after reconciliation.
      - name: Recheck the fixed provider evidence and reconcile one call with CAS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXPECTED_STATE_SHA: ${{ inputs.expected_state_sha }}
          CONFIRM_EXCLUSIVE_KEY_DELTA: ${{ inputs.confirm_exclusive_key_delta }}
        run: |
          if [ "$CONFIRM_EXCLUSIVE_KEY_DELTA" != "true" ]; then
            echo 'The recorded exclusive-key confirmation is required.'
            exit 2
          fi
          node dist/maintenance-reconcile.js --expected-state-sha "$EXPECTED_STATE_SHA" --confirm-exclusive-key-delta
